syntax = "proto3";

package v1;

option go_package = "example.com/target/gen/v1;v1";

message PingRequest {
  int32 number = 1;
}

message PingResponse {
  int32 number = 1;
}

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetStatus(PingRequest) returns (PingResponse);
}
